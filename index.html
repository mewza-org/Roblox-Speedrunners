<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox Speedrun Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#f2f2f3;font-family:'Space Grotesk',system-ui,sans-serif}
.w{max-width:1040px;margin:0 auto;padding:56px 20px 80px;display:flex;flex-direction:column;align-items:center;gap:20px}
.m{font-family:'JetBrains Mono',ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #c8ff3d;outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.logo{width:56px;height:56px;border-radius:16px;background:#c8ff3d;color:#000;display:flex;align-items:center;justify-content:center}
h1{margin:0;font-size:44px;line-height:1.1}
header p{margin:0;color:#8a8a93;font-size:15px}
.bar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tab{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;background:#0d0d10;border:1px solid #26262c;color:#a1a1aa;font-size:14px;font-weight:500}
.tab:hover{color:#fff;border-color:#3a3a42}
.tab.on{background:#f2f2f3;color:#000;border-color:#f2f2f3}
.srch{height:44px;width:min(100%,320px);border-radius:12px;background:#0d0d10;border:1px solid #26262c;color:#f2f2f3;padding:0 16px;font:inherit;font-size:14px;text-align:center}
.srch::placeholder{color:#8a8a93}
.best{display:flex;align-items:center;gap:14px;padding:16px 28px;border-radius:16px;border:1px solid #3d3d12;background:#0f0f08}
.best small{color:#c8ff3d;font-size:12px}
.best div.t{display:flex;flex-direction:column;align-items:center;gap:2px}
.list{width:100%;display:flex;flex-direction:column;gap:10px}
.item{background:#0b0b0e;border:1px solid #1f1f24;border-radius:16px}
.row{width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;padding:14px 18px;background:none;border:0;border-radius:16px;text-align:left}
.row:hover{background:#101014}
.rk{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#15151a;font-weight:700;font-size:18px;flex:none}
.r1{background:#ffd23f;color:#000}.r2{background:#d4d8df;color:#000}.r3{background:#cd8f5a;color:#000}
.av{position:relative;width:48px;height:48px;border-radius:12px;background:#1a1a20;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#c8ff3d;flex:none;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.who{display:flex;align-items:center;gap:12px;flex:1 1 250px;min-width:0}
.nm{display:flex;flex-direction:column;gap:2px;min-width:0}
.nm b{font-size:17px;overflow-wrap:anywhere}.nm small{color:#8a8a93;font-size:13px;overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;gap:6px;color:#a1a1aa;font-size:12px}
.reg{height:24px;padding:0 10px;border-radius:8px;background:#1b1b22;color:#c8ff3d;font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;flex:1 1 380px}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:12px;background:#121216;border:1px solid #1f1f24;color:#a1a1aa}
.cell b{font-size:20px;color:#f2f2f3}.cell i{font-style:normal;font-size:12px;font-weight:700}.cell span{font-size:11px;letter-spacing:.06em;color:#8a8a93}
.hl{border-color:#c8ff3d}
.hot{border-color:#ff7a1a;animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 10px rgba(255,122,26,.25),inset 0 0 10px rgba(255,122,26,.12)}to{box-shadow:0 0 22px rgba(255,122,26,.5),inset 0 0 16px rgba(255,122,26,.25)}}
.fl{position:absolute;top:-14px;right:-6px;width:24px;height:30px;transform-origin:50% 100%;animation:flick .8s ease-in-out infinite alternate;pointer-events:none}
.fl .o{fill:#ff6a1a}.fl .n{fill:#ffd23f;transform-origin:50% 100%;animation:flick2 .55s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) rotate(-4deg)}50%{transform:scale(.9,1.14) rotate(3deg)}100%{transform:scale(1.06,.94) rotate(-2deg)}}
@keyframes flick2{from{transform:scale(1,1)}to{transform:scale(.8,1.2)}}
@media (prefers-reduced-motion:reduce){.fl,.fl .n,.hot{animation:none}}
.tot{width:104px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;flex:none}
.tot b{font-size:26px}.tot small{color:#8a8a93;font-size:12px}.tot i{font-style:normal;font-weight:700;font-size:15px}
.det{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:18px;border-top:1px solid #1f1f24}
.f{flex:1 1 200px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px;border-radius:12px;background:#121216;text-align:center}
.f small{color:#8a8a93;font-size:12px}.f span,.f a{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.f a{color:#c8ff3d}
.bd{width:34px;height:38px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;color:#000;font-weight:700;font-size:12px}
.bars{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.br{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:#121216}
.br .l{display:flex;justify-content:space-between;font-size:13px;color:#a1a1aa}
.br .tr{height:6px;border-radius:3px;background:#24242a}.br .tr div{height:6px;border-radius:3px;background:#c8ff3d}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80}.dot.off{background:#6b6b75}
.empty{text-align:center;color:#8a8a93}
</style>
</head>
<body>
<main class="w">
<header>
<div class="logo"><svg class="i" style="width:30px;height:30px;stroke-width:2.2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="7"/><path d="M12 14l3-3M9 3h6M12 3v4"/></svg></div>
<h1 id="title">Leaderboard</h1>
<p id="sub"></p>
</header>
<nav class="bar" id="tabs" aria-label="Category"></nav>
<div class="bar" id="plats"></div>
<div class="bar"><input class="srch" id="q" placeholder="Search players…" aria-label="Search players" autocomplete="off"></div>
<div id="best"></div>
<div class="list" id="list"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={
 all:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM12 14v4M8 20h8M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/>',
 bounce:'<circle cx="12" cy="6" r="3"/><path d="M7 20l2.5-3 2.5 3 2.5-3 2.5 3"/>',
 nobounce:'<path d="M5 5v14h14"/><path d="M5 5l14 14" stroke-dasharray="2 3"/>',
 cam:'<rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="12" cy="13" r="3"/><path d="M8 7l1.5-2h5L16 7"/>',
 consistency:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',
 pc:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
 mob:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
 yt:'<rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>'
};
const ic=(k,s)=>`<svg class="i" ${s?`style="width:${s}px;height:${s}px"`:''} viewBox="0 0 24 24" aria-hidden="true">${IC[k]||''}</svg>`;
const FL='<svg class="fl" viewBox="0 0 24 30" aria-label="On fire"><path class="o" d="M12 1c1 6 9 9 9 18a9 9 0 0 1-18 0c0-4 2-6 4-8 0 3 1 5 3 5 0-6-1-9 2-15z"/><path class="n" d="M12 14c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 2-4 0 1 1 2 1 2 0-2 0-4 1-6z"/></svg>';
const COL={S:'#ffd23f',A:'#4ade80',B:'#7aa2ff',C:'#c9b6ff',D:'#e0a96d',F:'#ff6b6b'};
let CFG,P=[],S={tab:'all',plat:'all',q:'',open:null},CACHE={};
const grade=(v,top)=>{if(top)return'S+';for(const[m,g]of CFG.grades)if(v>=m)return g;return'F-'};
const col=g=>COL[g[0]];
const mob=p=>/^mob/i.test(p.device||'');
const num=(p,k)=>+p[k]||0;
function flame(p,key,v){const o=p.flames&&p.flames[key];if(typeof o==='boolean')return o;const F=CFG.flame;return !!F.enabled&&v>=(key==='overall'?F.overall:F.category)}
function ago(iso){const s=(Date.now()-new Date(iso))/1000;if(s<60)return Math.max(0,Math.floor(s))+'s ago';if(s<3600)return Math.floor(s/60)+'mins ago';if(s<86400)return Math.floor(s/3600)+'hrs ago';if(s<2592000)return Math.floor(s/86400)+' days ago';return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function age(p){const d=p.joined||p.created;if(!d)return null;const y=Math.floor((Date.now()-new Date(d))/31557600000);return{t:y<1?'<1y':y+'y',c:y>=8?'#c8ff3d':y>=5?'#ffd23f':y>=3?'#d4d8df':y>=1?'#cd8f5a':'#8a8a93',d:new Date(d).toLocaleDateString('en-US',{month:'short',year:'numeric'})}}
const nameOf=p=>p.liveName||p.name||'';
const dispOf=p=>p.liveDisplay||p.display||nameOf(p);
const av=p=>`<span class="av">${esc(dispOf(p)[0]||'?')}${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`;
function cellsOf(p,top){return CFG.categories.map(c=>{const v=num(p,c.key),g=grade(v);return`<span class="cell ${S.tab===c.key?'hl':''} ${flame(p,c.key,v)?'hot':''}">${flame(p,c.key,v)?FL:''}${ic(c.key)}<b class="m">${v}</b><i style="color:${col(g)}">${g}</i><span>${esc(c.short)}</span></span>`}).join('')}
function detail(p){const a=age(p),on=p.lastOnline?true:p.status==='active';
 const seen=p.lastOnline?ago(p.lastOnline):(p.status==='active'?'Active':'Inactive');
 return`<div class="det">
 <div class="f"><small>Country</small><span>${esc(p.country||'n/a')}${p.region?' · '+esc(p.region):''}</span></div>
 <div class="f"><small>Last online</small><span><i class="dot ${on?'':'off'}"></i>${esc(seen)}</span></div>
 <div class="f"><small>Joined Roblox</small><span>${a?`<b class="bd" style="background:${a.c}">${a.t}</b>${a.d}`:'n/a'}</span></div>
 <div class="f"><small>Profile</small><a href="https://www.roblox.com/users/${esc(p.id)}/profile" target="_blank" rel="noopener">roblox.com/users/${esc(p.id)}</a></div>
 <div class="f"><small>Hardest tower</small><span>${esc(p.tower||'n/a')}</span></div>
 <div class="f"><small>Hardest obby</small><span>${esc(p.obby||'n/a')}</span></div>
 ${p.youtube?`<div class="f"><small>YouTube</small><a href="${esc(p.youtube)}" target="_blank" rel="noopener">${ic('yt')}Channel</a></div>`:''}
 <div class="bars">${CFG.categories.map(c=>{const v=num(p,c.key),g=grade(v);return`<div class="br"><div class="l"><b style="color:#f2f2f3">${esc(c.label)}</b><span><b class="m" style="color:#f2f2f3">${v}</b> ${g.replace('+','+')}</span></div><div class="tr"><div style="width:${v}%"></div></div></div>`}).join('')}</div></div>`}
function render(){
 const n=CFG.categories.length,all=S.tab==='all',max=all?100*n:100;
 let L=P.filter(p=>S.plat==='all'||(S.plat==='mob')===mob(p));
 L.forEach(p=>{p.total=CFG.categories.reduce((a,c)=>a+num(p,c.key),0);p.main=all?p.total:num(p,S.tab)});
 L.sort((a,b)=>b.main-a.main||b.total-a.total);
 L.forEach((p,i)=>p.rank=i+1);
 const q=S.q.trim().toLowerCase();
 const V=L.filter(p=>!q||[p.name,p.display,p.liveName,p.liveDisplay].some(x=>String(x||'').toLowerCase().includes(q)));
 const lab=all?'Overall':CFG.categories.find(c=>c.key===S.tab).label,b=L[0];
 $('#best').innerHTML=b?`<div class="best">${av(b)}<div class="t"><small>Best in ${esc(lab.toLowerCase())}</small><b style="font-size:18px">${esc(dispOf(b))}</b></div><b class="m" style="font-size:28px">${b.main}</b></div>`:'';
 $('#list').innerHTML=V.map(p=>{const g=grade(all?Math.round(p.total/n):p.main,p.rank===1),open=S.open===p.id,dv=mob(p);
 return`<div class="item"><button class="row" data-id="${esc(p.id)}" aria-expanded="${open}">
 <span class="rk ${p.rank<4?'r'+p.rank:''}">${p.rank}</span>
 <span class="who">${av(p)}<span class="nm"><b>${esc(dispOf(p))}</b><small>@${esc(nameOf(p))}</small><span class="tag">${ic(dv?'mob':'pc')}${dv?'Mobile':'PC'}${p.region?` <span class="reg">${esc(p.region)}</span>`:''}</span></span></span>
 <span class="cells">${cellsOf(p)}</span>
 <span class="tot">${all&&flame(p,'overall',p.total)?FL:''}<b class="m">${p.main}</b><small>/${max}</small><i style="color:${col(g)}">${g}</i></span>
 </button>${open?detail(p):''}</div>`}).join('')||'<p class="empty">No players found.</p>';
}
function tabs(){const t=[{key:'all',label:'Overall'},...CFG.categories];
 $('#tabs').innerHTML=t.map(c=>`<button class="tab ${S.tab===c.key?'on':''}" data-tab="${c.key}">${ic(c.key)}${esc(c.label)}</button>`).join('');
 $('#plats').innerHTML=[['all','All players',''],['pc','PC','pc'],['mob','Mobile','mob']].map(([k,l,i])=>`<button class="tab ${S.plat===k?'on':''}" data-plat="${k}">${i?ic(i):''}${l}</button>`).join('')}
async function profiles(){
 const R=CFG.roblox,ttl=(R.cacheMinutes||60)*6e4,now=Date.now();
 try{CACHE=JSON.parse(localStorage.getItem('rsl')||'{}')}catch{CACHE={}}
 const need=P.map(p=>p.id).filter(id=>!CACHE[id]||now-CACHE[id].t>ttl);
 for(let i=0;i<need.length;i+=100){const ids=need.slice(i,i+100);
  try{const r=await fetch(R.users+'/v1/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userIds:ids.map(Number),excludeBannedUsers:false})});
   (await r.json()).data.forEach(u=>{CACHE[u.id]={...CACHE[u.id],n:u.name,d:u.displayName,t:now}})}catch{}
  try{const r=await fetch(`${R.thumbnails}/v1/users/avatar-headshot?userIds=${ids.join(',')}&size=150x150&format=Png`);
   (await r.json()).data.forEach(u=>{CACHE[u.targetId]={...CACHE[u.targetId],i:u.imageUrl,t:now}})}catch{}}
 try{localStorage.setItem('rsl',JSON.stringify(CACHE))}catch{}
 apply();render()}
function apply(){P.forEach(p=>{const c=CACHE[p.id];if(c){p.liveName=c.n;p.liveDisplay=c.d;p.img=c.i;p.created=p.created||c.c}})}
async function created(p){if(p.created||p.joined||p._t)return;p._t=1;
 try{const r=await fetch(`${CFG.roblox.users}/v1/users/${p.id}`);p.created=(await r.json()).created;CACHE[p.id]={...CACHE[p.id],c:p.created};try{localStorage.setItem('rsl',JSON.stringify(CACHE))}catch{}}catch{}
 if(S.open===p.id)render()}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]'),pl=e.target.closest('[data-plat]'),r=e.target.closest('.row');
 if(t){S.tab=t.dataset.tab;S.open=null;tabs();render()}
 else if(pl){S.plat=pl.dataset.plat;S.open=null;tabs();render()}
 else if(r){const id=r.dataset.id;S.open=S.open===id?null:id;render();const p=P.find(x=>x.id===id);if(S.open&&p)created(p)}});
$('#q').addEventListener('input',e=>{S.q=e.target.value;render()});
(async()=>{
 try{[CFG,P]=await Promise.all([fetch('config.json').then(r=>r.json()),fetch('players.json').then(r=>r.json())])}
 catch{$('#list').innerHTML='<p class="empty">Couldn’t load config.json or players.json. Open this page through GitHub Pages or a local server.</p>';return}
 P.forEach(p=>p.id=String(p.id));
 document.title=CFG.title;$('#title').textContent=CFG.title;$('#sub').textContent=CFG.subtitle||'';
 tabs();try{CACHE=JSON.parse(localStorage.getItem('rsl')||'{}')}catch{}apply();render();profiles()})();
</script>
</body>
</html>
